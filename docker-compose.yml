# Local development stack: API + PostGIS + Redis + Kafka (single broker, KRaft).
# Production runs the same services on a MeitY-empanelled cloud, data resident in India.

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: kumbh
      POSTGRES_PASSWORD: kumbh
      POSTGRES_DB: kumbh
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumbh"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: bitnami/kafka:3.6
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://kumbh:kumbh@db:5432/kumbh
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8000:8000"]
    volumes: ["./backend:/srv", "./frontend:/srv-frontend"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}

  # Background consumers: SOS dispatch, crowd ingest, alert fan-out.
  worker:
    build: .
    command: python -m app.workers.runner
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://kumbh:kumbh@db:5432/kumbh
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
    volumes: ["./backend:/srv"]
    depends_on: [db, kafka]

volumes:
  pgdata:
